# Native Windows build. Output: hadoop-<version>/ (layout depends on package_mode).
# Callable manually, from check-hadoop-releases.yml, or via workflow_dispatch.
name: Build Windows Native

on:
  workflow_dispatch:
    inputs:
      hadoop_version:
        description: Hadoop version (e.g. 3.4.1)
        required: true
        default: "3.4.1"
        type: string
      package_mode:
        description: "native = DLLs only; tarball = lite HADOOP_HOME; full = complete Apache release"
        required: true
        default: native
        type: choice
        options:
          - native
          - tarball
          - full
      create_release:
        description: Publish GitHub Release with zip asset
        required: true
        default: true
        type: boolean

  workflow_call:
    inputs:
      hadoop_version:
        required: true
        type: string
      package_mode:
        required: false
        type: string
        default: native
      create_release:
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360

    env:
      HADOOP_VERSION: ${{ inputs.hadoop_version }}
      PACKAGE_MODE: ${{ inputs.package_mode || 'native' }}
      CREATE_RELEASE: ${{ inputs.create_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17.0.20"
          architecture: x64

      - name: Setup Windows toolchain (MSVC, Maven, paths)
        shell: powershell
        run: |
          & "${{ github.workspace }}/scripts/setup-windows-runner.ps1" -ExportToGitHubEnv

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-win-${{ hashFiles('scripts/build-windows-native.sh', 'versions.conf') }}
          restore-keys: |
            maven-win-

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:/vcpkg
          key: vcpkg-win-2026.06.24-${{ hashFiles('scripts/build-windows-native.sh', 'scripts/build-hdfs-dll-native.sh') }}
          restore-keys: |
            vcpkg-win-

      - name: Cache Hadoop release tarballs
        if: inputs.package_mode == 'tarball' || inputs.package_mode == 'full'
        uses: actions/cache@v4
        with:
          path: .cache/hadoop-releases
          key: hadoop-releases-${{ inputs.hadoop_version }}

      - name: Build native + assemble
        shell: powershell
        env:
          CI: true
          GITHUB_ACTIONS: true
          HADOOP_SRC: C:/hadoop-src
          WINUTILS_PACKAGE_MODE: ${{ inputs.package_mode || 'native' }}
          VCPKG_ROOT: C:/vcpkg
          VCPKG_COMMIT: "2026.06.24"
        run: |
          & "${{ github.workspace }}/scripts/run-build-native.ps1" -HadoopVersion "${{ inputs.hadoop_version }}"

      - name: Create distribution zip
        shell: powershell
        run: |
          $ver = "${{ inputs.hadoop_version }}"
          $mode = "${{ inputs.package_mode || 'native' }}"
          $zip = "hadoop-$ver.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "hadoop-$ver" -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-List Name, Length
          "artifact_suffix=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hadoop-${{ inputs.hadoop_version }}-${{ inputs.package_mode || 'native' }}-windows
          path: |
            hadoop-${{ inputs.hadoop_version }}/
            hadoop-${{ inputs.hadoop_version }}.zip
          retention-days: 14

      - name: Check existing GitHub Release
        id: release_check
        if: inputs.create_release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ inputs.hadoop_version }}"
          $mode = "${{ inputs.package_mode || 'native' }}"
          $suffix = if ($mode -eq 'native') { '' } else { "-$mode" }
          $tag = "hadoop-$ver$suffix"
          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $exists = $false
          if (Get-Command gh -ErrorAction SilentlyContinue) {
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { $exists = $true }
          }
          if ($exists) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release $tag already exists - skip publish"
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Publish GitHub Release
        if: inputs.create_release && steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_check.outputs.release_tag }}
          name: Hadoop ${{ inputs.hadoop_version }} — Windows native (${{ inputs.package_mode || 'native' }})
          body: |
            Windows build for [Apache Hadoop ${{ inputs.hadoop_version }}](https://hadoop.apache.org/).

            **Package mode:** `${{ inputs.package_mode || 'native' }}`
            - `native` — `winutils.exe`, `hadoop.dll`, `hdfs.dll` only (`bin/`)
            - `tarball` — lite `HADOOP_HOME` (Apache release + native overlay, trimmed)
            - `full` — complete Apache release + native overlay

            JDK build: Temurin 17.0.20.x (use same major at runtime).

            Extract the zip. For `native`, copy `bin/` into your existing `HADOOP_HOME` or set `HADOOP_HOME` to the extracted folder if you only need native libs.
          files: hadoop-${{ inputs.hadoop_version }}.zip
          fail_on_unmatched_files: true
