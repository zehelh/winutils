# Native Windows build (no Wine). Same hadoop-<version>/ layout as ./build.sh
# Refs:
#   - https://docs.github.com/en/actions/how-tos/writing-workflows/building-and-testing/building-and-testing-java-with-maven
#   - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defaultsrunshell
#   - https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
# Note: there is NO official actions/setup-maven — Maven is preinstalled on windows-latest.
name: Build Windows Native

on:
  workflow_dispatch:
    inputs:
      hadoop_version:
        description: Hadoop version
        required: true
        default: "3.4.1"
        type: string
      dist_profile:
        description: Distribution profile (lite or full)
        required: true
        default: lite
        type: choice
        options:
          - lite
          - full

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # SemVer: 17.0.20.1 is invalid (4 segments). 17.0.20 resolves Temurin 17.0.20.x
          java-version: "17.0.20"
          architecture: x64
          cache: maven

      - name: Verify toolchain
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          mvn -version
          git --version

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg
          key: vcpkg-win-${{ hashFiles('docker/Dockerfile', 'scripts/build-windows-native.sh') }}
          restore-keys: |
            vcpkg-win-

      - name: Cache Hadoop release tarballs
        uses: actions/cache@v4
        with:
          path: .cache/hadoop-releases
          key: hadoop-releases-${{ inputs.hadoop_version }}

      - name: Build native + assemble
        env:
          CI: true
          HADOOP_DIST_PROFILE: ${{ inputs.dist_profile }}
          VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
          SHELL_EXECUTABLE: bash.exe
        run: |
          chmod +x scripts/build-windows-native.sh docker/assemble-from-release.sh docker/overlay-native-bin.sh docker/verify-cdarlint-bin.sh
          bash scripts/build-windows-native.sh "${{ inputs.hadoop_version }}"

      - name: Upload HADOOP_HOME artifact
        uses: actions/upload-artifact@v4
        with:
          name: hadoop-${{ inputs.hadoop_version }}-windows-native
          path: hadoop-${{ inputs.hadoop_version }}/
          retention-days: 14
